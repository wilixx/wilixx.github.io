<dialog class="academic-contact-dialog" id="academic-contact-dialog" aria-labelledby="academic-contact-title" aria-describedby="academic-contact-hint">
  <button class="academic-contact-close" type="button" aria-label="Close contact dialog" autofocus>×</button>
  <h2 id="academic-contact-title">{% include academic-wechat-icon.html %}<span data-contact-copy="title">WeChat</span></h2>
  <p class="academic-contact-hint" id="academic-contact-hint" data-contact-copy="hint">Scan the QR code to connect.</p>
  <img class="academic-contact-qr" src="{{ '/images/wechat-academic.png' | relative_url }}" alt="Binquan Guo's WeChat contact QR code" width="410" height="410" loading="lazy" decoding="async">
  <div class="academic-contact-actions">
    <a class="academic-contact-save" href="{{ '/images/wechat-academic.png' | relative_url }}" download="binquan-guo-wechat.png" data-contact-copy="save">Save QR code</a>
    <a class="academic-contact-linkedin" href="https://www.linkedin.com/in/binquan-guo-754078371/" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn profile in a new tab">LinkedIn <span aria-hidden="true">↗</span></a>
  </div>
</dialog>
