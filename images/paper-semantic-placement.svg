<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="semantic-placement-title semantic-placement-desc">
  <title id="semantic-placement-title">Semantic encoding and decoding near network endpoints</title>
  <desc id="semantic-placement-desc">A multi-hop satellite route has an encoder near the sending end and a decoder near the receiving end. Parallel incoming and outgoing strokes surround a single semantic route. The arrangement illustrates the fixed-hop placement question studied in the paper.</desc>
