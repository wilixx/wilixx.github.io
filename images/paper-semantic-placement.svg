  <path fill="#fff" d="M0 0h320v200H0z"/>
  <path d="M37 149Q160 108 283 149" fill="none" stroke="#e7edf0" stroke-width="2"/>
  <g fill="none" stroke="#8a9ca5" stroke-width="2.5" stroke-linecap="round"><path d="m35 138 32-56m-24 58 32-55m202 53-32-56m24 58-32-55"/></g>
  <path d="M76 70h168" fill="none" stroke="#708b78" stroke-width="5" stroke-linecap="round"/>
  <path d="m157 65 8 5-8 5" fill="none" stroke="#708b78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#placement-satellite" x="76" y="70"/><use href="#placement-satellite" x="132" y="70"/><use href="#placement-satellite" x="188" y="70"/><use href="#placement-satellite" x="244" y="70"/>
  <g fill="#fff" stroke="#647b89" stroke-width="3" stroke-linejoin="round"><rect x="22" y="139" width="29" height="21" rx="3"/><path d="M36.5 160v9m-10 0h20"/><rect x="269" y="139" width="29" height="21" rx="3"/><path d="M283.5 160v9m-10 0h20"/></g>
  <rect x="64" y="93" width="24" height="24" rx="6" fill="#708b78"/><rect x="232" y="93" width="24" height="24" rx="6" fill="#c5976c"/>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="600"><text x="76" y="110">E</text><text x="244" y="110">D</text></g>
  <g fill="#d8e2e7"><circle cx="114" cy="141" r="3"/><circle cx="160" cy="131" r="3"/><circle cx="206" cy="141" r="3"/></g>
